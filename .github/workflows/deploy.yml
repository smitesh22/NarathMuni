name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  terraform:
    name: Deploy with Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          echo "Installing all dependencies..."
          npm install --omit=dev

      - name: Generate Prisma Client
        run: |
          npx prisma generate

      - name: Uninstall Prisma and Typescript
        run: |
          echo "Removing devDependencies to reduce deployment size..."
          npm uninstall prisma typescript
          echo "Completed."

      - name: Bundle with esbuild (Tree-Shaking & Minification)
        run: |
          echo "Bundling with esbuild..."
          npx esbuild index.js --bundle --platform=node --target=node20 --outdir=dist --external:aws-sdk
          echo "Bundling completed."

      - name: Verify bundled files
        run: |
          echo "Checking bundled files in ./dist..."
          ls -al ./dist

      - name: Package the bundled app for Lambda
        run: |
          echo "Packaging index.js and node_modules into app.zip..."
          zip -r app.zip dist/ node_modules \
          -x "*.ts" "*.md" "tests/**" "docs/**" "node_modules/.cache/**" "node_modules/aws-sdk/**" "node_modules/.bin/**"
          echo "Packaging completed."fv

      - name: Extract and Analyze node_modules
        run: |
          echo "Extracting app.zip..."
          mkdir extracted
          unzip -q app.zip -d extracted
          echo "Checking extracted node_modules size and top 20 largest directories:"
          du -sh extracted/node_modules/* | sort -rh | head -n 20
          echo "Checking base folder sizes:"
          du -sh extracted/* | sort -rh

      - name: Fail if app.zip is too large
        run: |
          MAX_SIZE=50000 # 50 MB in KB
          ACTUAL_SIZE=$(du -k "app.zip" | cut -f1)
          if [ "$ACTUAL_SIZE" -gt "$MAX_SIZE" ]; then
            echo "Error: app.zip size is too large: ${ACTUAL_SIZE} KB (Max allowed: ${MAX_SIZE} KB)"
            exit 1
          fi

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Initialize Terraform with S3 backend
        run: terraform init
        working-directory: ./terraform

      - name: Validate Terraform
        run: terraform validate
        working-directory: ./terraform

      - name: Plan Terraform
        run: terraform plan
        working-directory: ./terraform

      - name: Apply Terraform
        run: terraform apply -auto-approve
        working-directory: ./terraform
