name: CI/CD Pipeline (Dev)

on:
  push:
    branches:
      - dev  # This triggers deployment when pushing to the 'dev' branch

jobs:
  terraform-dev:
    name: Deploy to Dev with Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      - name: Install all dependencies
        run: npm install --omit=dev

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Remove Unnecessary Prisma Binaries
        run: |
          rm -rf node_modules/@prisma/engines/
          rm -rf node_modules/@prisma/client/libquery_engine*
          rm -rf node_modules/prisma

      - name: Bundle with esbuild
        run: npx esbuild index.js --bundle --platform=node --target=node20 --outdir=dist --external:aws-sdk --sourcemap

      - name: Package for Lambda
        run: |
          zip -r app.zip dist/ node_modules \
          -x "*.ts" "*.md" "tests/**" "docs/**" "node_modules/.cache/**" "node_modules/aws-sdk/**" "node_modules/.bin/**"

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Initialize Terraform with S3 backend
        run: terraform init
        working-directory: ./terraform

      - name: Select Terraform Workspace (Dev)
        run: |
          terraform workspace select dev || terraform workspace new dev
        working-directory: ./terraform

      - name: Validate Terraform
        run: terraform validate
        working-directory: ./terraform

      - name: Plan Terraform Deployment
        run: terraform plan
        working-directory: ./terraform

      - name: Apply Terraform (Dev)
        run: terraform apply -auto-approve
        working-directory: ./terraform
