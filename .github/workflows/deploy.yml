name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  terraform:
    name: Deploy with Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --production  # Install only production dependencies

      - name: Build and package the app
        run: |
          zip -r app.zip . -x "*.git*" "*.github*" "*.terraform*" "*.log" "node_modules/aws-sdk/*" "tests/*" "docs/*" "prisma/**"

      - name: Check app.zip size
        run: |
          echo "Checking the size of app.zip..."
          du -h app.zip  # Show the size in human-readable format
          unzip -l app.zip  # List the files inside the zip with their sizes

      - name: Fail if app.zip is too large
        run: |
          MAX_SIZE=50000 # 50 MB in KB
          ACTUAL_SIZE=$(du -k "app.zip" | cut -f1)
          if [ "$ACTUAL_SIZE" -gt "$MAX_SIZE" ]; then
            echo "Error: app.zip size is too large: ${ACTUAL_SIZE} KB (Max allowed: ${MAX_SIZE} KB)"
            exit 1
          fi

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Initialize Terraform with S3 backend
        run: terraform init
        working-directory: ./terraform

      - name: Validate Terraform
        run: terraform validate
        working-directory: ./terraform

      - name: Plan Terraform
        run: terraform plan
        working-directory: ./terraform

      - name: Apply Terraform
        run: terraform apply -auto-approve
        working-directory: ./terraform
